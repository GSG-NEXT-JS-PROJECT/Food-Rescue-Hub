[build]
  command = "npm run build"
  publish = ".next"

# Fixed plugins section (array syntax)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache headers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"